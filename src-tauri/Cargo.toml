[package]
name = "nph-lova-database"
version = "1.0.0"
description = "Comprehensive Clinical & Research Registry for Normal Pressure Hydrocephalus (NPH) and Long-Standing Overt Ventriculomegaly in Adults (LOVA)"
authors = ["Dr G Narenthiran MB ChB BSc(MedSci)(Hons) MRCS(Ed.) FEBNS FRCS(SN)"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
